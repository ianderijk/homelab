[project]
name = "playground"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.118",
    "polars>=2.0.0",
    "sqlalchemy>=2.1.6",
    "typer>=0.27.0",
    "data-utils",
    "logger"
]

[tool.uv.sources]
data-utils = { path = "lib/data-utils", editable = true }
logger = { path = "lib/logger", editable = true }

[dependency-groups]
dev = [
    "ruff>=0.15.22",
    "ty>=0.0.90",
]

[tool.uv.workspace]
members = [
    "lib/playground-cli",
    "lib/package-setup"
]

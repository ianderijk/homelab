name: playground

services:
  chapflix-api:
    container_name: chapflix2-api-container
    build:
      context: ${CHAPFLIX_IMAGE_CONTEXT}
      dockerfile: ${CHAPFLIX_API_IMAGE}
    ports:
      - "8043:8043"
    environment:
      DATABASE_URL: ${POSTGRES_PYTHON_URL}
      HOST: 0.0.0.0
    networks:
      - playground-net
    restart: unless-stopped

networks:
  playground-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

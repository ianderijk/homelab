name: playground

services:
  kaneo:
    image: ghcr.io/usekaneo/kaneo:2.28.3
    restart: unless-stopped
    environment:
      - DATABASE_URL=${POSTGRES_URL_KANEO:?POSTGRES_URL_KANEO is not set - is mise active?}
      - KANEO_CLIENT_URL=${KANEO_CLIENT_URL:?KANEO_CLIENT_URL is not set - is mise active?}
      - AUTH_SECRET=${KANEO_AUTH_SECRET:?KANEO_AUTH_SECRET is not set - is mise active?}
    healthcheck:
      test: ["CMD", "wget", "-Y", "off", "--quiet", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    ports:
      - "5173:5173"
    networks:
      - playground-net

networks:
  playground-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

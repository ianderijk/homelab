name: playground

services:
  pypiserver:
    image: docker.io/pypiserver/pypiserver:latest
    container_name: pypiserver
    environment:
      HOST: 0.0.0.0
    ports:
      - "8080:8080"
    volumes:
      - /home/idr/packages:/data/packages
    command: run --port "8080" -P . -a . /data/packages
    networks:
      - playground-net
    restart: always

networks:
  playground-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

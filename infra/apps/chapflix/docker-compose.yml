name: playground

services:
  chapflix:
    container_name: chapflix2-container
    build:
      context: ${CHAPFLIX_IMAGE_CONTEXT}
      dockerfile: ${CHAPFLIX_APP_IMAGE}
    ports:
      - "8042:8042"
    environment:
      CHAPFLIX_API_URL: http://chapflix2-api-container:8043/
      MEDIA_FILES: ${MEDIA_FILES}
      DATABASE_URL: ${POSTGRES_PYTHON_URL}
      PYTHONUNBUFFERED: 1
      HOST: 0.0.0.0
    volumes:
      - ${CHAPFLIX_IMAGE_VOLUME}
    networks:
      - playground-net
    restart: unless-stopped

networks:
  playground-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24

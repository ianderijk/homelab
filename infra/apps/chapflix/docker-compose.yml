name: playground

services:
  chapflix:
    container_name: chapflix2-container
    build:
      context: /media/idr/ExtDrive/Chapflix2
      dockerfile: /media/idr/ExtDrive/Chapflix2/infra/docker/Dockerfile.app
    ports:
      - "8042:8042"
    environment:
      CHAPFLIX_API_URL: http://chapflix2-api-container:8043/
      MEDIA_FILES: ${MEDIA_FILES}
      DATABASE_URL: ${PYTHON_POSTGRES_URL}
      PYTHONUNBUFFERED: 1
      HOST: 0.0.0.0
    volumes:
      - /media/idr/ExtDrive/Chapflix2/content:/app/content
    networks:
      - playground-net
    restart: unless-stopped

networks:
  playground-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
